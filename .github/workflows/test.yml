name: Tests

on:
  push:
    branches: [ master, smart-tv ]
  pull_request:
    branches: [ master, smart-tv ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.19'
      id: go

    - name: Check out code
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Check gofmt
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "The following files need formatting:"; gofmt -s -l .; exit 1; fi